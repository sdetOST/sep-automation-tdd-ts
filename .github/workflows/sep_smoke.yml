name: SEP Smoke Tests

on:
  # Triggers on push to any branch
  push:
    branches:
      - '**'
  # Runs every day at 6:00 AM UTC
  schedule:
    - cron: '0 6 * * *'
  # Allows manual execution from the GitHub Actions tab
  workflow_dispatch:

jobs:
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      SEP_QA_URL: ${{ secrets.SEP_QA_URL }}
      SEP_USERNAME: ${{ secrets.SEP_USERNAME }}
      SEP_PASSWORD: ${{ secrets.SEP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and system dependencies
        run: npx playwright install --with-deps chrome

      - name: Run Playwright smoke tests
        run: npx playwright test --grep @smoke --pass-with-no-tests

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 30
